<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Birge · QR-таблички</title>
  <link rel="stylesheet" href="/civic/ui-kit/tokens.css">
  <link rel="stylesheet" href="/civic/ui-kit/components.css">
  <link rel="stylesheet" href="/civic/qr/print.css">
</head>
<body class="bk-app">
  <main id="bqp-root" class="bqp"></main>
  <!-- R12: генератор QR (LOCAL-11, MIT). Нет файла — лист показывает честную заглушку. -->
  <script src="/vendor/qrcode/qrcode.js" onerror="this.remove()"></script>
  <script src="/civic/i18n/i18n.js"></script>
  <script src="/civic/qr/print.js"></script>
  <script>
    (function () {
      var start = function () { window.BirgeQrPrint.mount({ root: document.getElementById("bqp-root") }); };
      if (window.BirgeI18n && window.BirgeI18n.ready) window.BirgeI18n.ready.then(start, start); else start();
    })();
  </script>
</body>
</html>
