<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Birge · проекты и этапы (R06)</title>
    <!-- Стенд R06 для проверки карточек на настоящем API (tests/civic/R06/round14/serve_r14.py).
         В общую сборку не входит: R01 подключает только proposals.js и proposals.css.
         ?role=akimat — кнопки «Одобрить / Отклонить» (нужна сессия сотрудника); ?lang=kk — казахский. -->
    <link rel="stylesheet" href="/civic/ui-kit/tokens.css" />
    <link rel="stylesheet" href="/civic/ui-kit/components.css" />
    <link rel="stylesheet" href="/civic/proposals/proposals.css" />
    <style>
      body {
        margin: 0;
      }
      .r06-demo {
        max-width: 1320px;
        margin: 0 auto;
        padding: var(--s-5) var(--gutter-phone) 120px;
        display: grid;
        gap: var(--s-6);
      }
      .r06-demo__head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: var(--s-3);
      }
      .r06-demo__sub {
        margin: var(--s-5) 0 var(--s-3);
      }
      .r06-demo__grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(360px, 100%), 1fr));
        gap: var(--s-4);
        align-items: start;
      }
    </style>
  </head>
  <body class="bk-app">
    <main class="r06-demo">
      <div class="r06-demo__head">
        <h1 class="bk-h1" data-i18n="proposal.catalog.title"></h1>
        <div id="lang"></div>
      </div>
      <p class="bk-meta" data-i18n="common.tag.demo_hint"></p>
      <section>
        <h2 class="bk-h2" data-i18n="akim.proposals.title"></h2>
        <div class="r06-demo__grid" id="proposals"></div>
      </section>
      <section>
        <h2 class="bk-h2" data-i18n="akim.late.title"></h2>
        <div id="objects"></div>
      </section>
    </main>
    <script src="/civic/i18n/i18n.js"></script>
    <script src="/civic/ui-kit/ui-kit.js"></script>
    <script src="/civic/proposals/proposals.js"></script>
    <script src="/civic/proposals/stage-editor.js"></script>
    <script>
      (function () {
        "use strict";
        var P = window.BirgeProposals;
        var role = new URLSearchParams(location.search).get("role") === "akimat" ? "akimat" : "resident";
        window.BirgeUI.langSwitch(document.getElementById("lang"));

        function cell(parent) {
          var el = document.createElement("div");
          parent.appendChild(el);
          return el;
        }

        function load() {
          var box = document.getElementById("proposals");
          window.BirgeUI.state(box, "loading");
          P.api.proposals().then(
            function (data) {
              box.innerHTML = "";
              if (!data.items.length) {
                window.BirgeUI.state(box, "empty");
                return;
              }
              data.items.forEach(function (p) {
                P.renderProposal(cell(box), p, { role: role });
              });
            },
            function () {
              window.BirgeUI.state(box, "error", { action: { onClick: load } });
            }
          );
          var objects = document.getElementById("objects");
          window.BirgeUI.state(objects, "loading");
          P.api.objects().then(
            function (data) {
              objects.innerHTML = "";
              // UX_REVIEW R11, день 3, п. 17 — как у R08: сначала отстающие от графика, ниже подраздел
              // «Давно не обновлялись» только с теми, кто не отстаёт (без повторов). Работающие не показываем.
              var active = data.items.filter(function (o) { return o.stage !== "operating"; });
              var late = active.filter(function (o) { return o.late; });
              var staleOnly = active.filter(function (o) { return o.stale && !o.late; });
              var lateGrid = document.createElement("div");
              lateGrid.className = "r06-demo__grid";
              lateGrid.setAttribute("data-group", "late");
              objects.appendChild(lateGrid);
              if (!late.length) window.BirgeUI.state(lateGrid, "empty", { title: window.BirgeI18n.t("akim.late.empty") });
              late.forEach(function (o) { objectCard(lateGrid, o); });
              if (staleOnly.length) {
                var h = document.createElement("h3");
                h.className = "bk-h2 r06-demo__sub";
                h.setAttribute("data-i18n", "akim.late.stale_title");
                objects.appendChild(h);
                var staleGrid = document.createElement("div");
                staleGrid.className = "r06-demo__grid";
                staleGrid.setAttribute("data-group", "stale");
                objects.appendChild(staleGrid);
                staleOnly.forEach(function (o) { objectCard(staleGrid, o); });
              }
              window.BirgeI18n.apply(objects);
              // Состояние «нет такого объекта» — тоже на стенде.
              var missing = document.createElement("div");
              missing.className = "r06-demo__grid";
              objects.appendChild(missing);
              P.mountObject(cell(missing), "no-such-object");
            },
            function () {
              window.BirgeUI.state(objects, "error", { action: { onClick: load } });
            }
          );
        }

        function objectCard(grid, o) {
          var card = cell(grid);
          var objEl = document.createElement("div");
          card.appendChild(objEl);
          P.renderObject(objEl, o);
          // Акимат: под карточкой — блок «Этап работ», как он встанет в редактор R12.
          if (role === "akimat") {
            var editor = document.createElement("div");
            editor.style.marginTop = "var(--s-3)";
            card.appendChild(editor);
            window.BirgeStageEditor.mount(editor, {
              objectId: o.id,
              onSaved: function () {
                P.api.object(o.id).then(function (d) {
                  P.renderObject(objEl, d.item);
                });
              },
            });
          }
        }
        window.BirgeI18n.ready.then(load);
      })();
    </script>
  </body>
</html>
