<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Спросить Birge — стенд R03</title>
<!-- Стенд экрана «Спросить Birge» (R03, раунд 15) без оболочки R01: те же ui-kit, словари и модуль, что в сборке.
     В продукте экран монтирует оболочка (BirgeShell.registerScreen, раздел #analyst) и кнопка «Показать на карте»
     открывает цель на тепловой карте; здесь вместо карты — строка внизу. Данные — POST /api/civic/v2/assistant/ask. -->
<link rel="stylesheet" href="../ui-kit/tokens.css">
<link rel="stylesheet" href="../ui-kit/components.css">
<link rel="stylesheet" href="analyst.css">
<style>
  body { margin: 0; min-height: 100vh; background: var(--c-paper); color: var(--c-ink); font-family: var(--font); }
  .stand-bar { position: relative; z-index: 2; display: flex; align-items: center; gap: 12px; height: 60px;
    padding: 0 20px; border-bottom: 1px solid var(--c-line); background: var(--glass-strong);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
    backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate)); }
  .stand-brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; font-size: 17px; }
  .stand-mark { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 10px;
    background: var(--c-lime); color: var(--c-lime-ink); font-weight: 700; }
  .stand-lang { margin-left: auto; display: inline-flex; gap: 2px; padding: 3px; border-radius: var(--r-m); background: var(--c-fill); }
  .stand-lang button { min-width: 52px; min-height: 38px; border: 0; border-radius: 9px; background: none; color: var(--c-text-2);
    font: inherit; font-size: var(--fs-caption); font-weight: 600; cursor: pointer; }
  .stand-lang button[aria-pressed="true"] { background: #fff; color: var(--c-ink); box-shadow: var(--shadow-1); }
  .stand-map { max-width: 760px; margin: 0 auto; padding: 0 20px 24px; color: var(--c-text-2); font-size: var(--fs-caption); }
  @media (max-width: 560px) { .stand-bar { padding: 0 16px; } .stand-map { padding: 0 16px 24px; } }
</style>
</head>
<body>
<header class="stand-bar">
  <span class="stand-brand"><span class="stand-mark" aria-hidden="true">B</span>Birge</span>
  <div class="stand-lang" role="group" aria-label="Тіл / Язык">
    <button type="button" data-lang="kk" aria-pressed="false">ҚАЗ</button>
    <button type="button" data-lang="ru" aria-pressed="true">РУС</button>
  </div>
</header>
<main id="analyst-root"></main>
<p class="stand-map" id="stand-map" aria-live="polite"></p>
<script src="../i18n/i18n.js"></script>
<script src="../ui-kit/ui-kit.js"></script>
<script src="analyst.js"></script>
<script>
  (function () {
    var mapLine = document.getElementById("stand-map");
    var params = new URLSearchParams(location.search);
    var lang = params.get("lang") === "kk" ? "kk" : "ru";
    var handle = window.BirgeAnalyst.mount(document.getElementById("analyst-root"), {
      apiBase: "/api/civic/v2", lang: lang, titleTag: "h1",
      openTarget: function (kind, id, days) {
        mapLine.textContent = (lang === "kk" ? "Карта: " : "Карта: ") + kind + " · " + id + (days ? " · " + days + " d" : "");
      },
      openSection: function (section) { mapLine.textContent = "→ #" + section; },
    });
    function setLang(next) {
      lang = next;
      document.documentElement.lang = next;
      document.querySelectorAll(".stand-lang button").forEach(function (b) {
        b.setAttribute("aria-pressed", String(b.dataset.lang === next));
      });
      if (window.BirgeI18n && window.BirgeI18n.setLang) { try { window.BirgeI18n.setLang(next, false); } catch (e) {} }
      handle.setLang(next);
    }
    document.querySelectorAll(".stand-lang button").forEach(function (b) {
      b.addEventListener("click", function () { setLang(b.dataset.lang); });
    });
    setLang(lang);
    var q = params.get("q");
    if (q) handle.ask(q);
    window.__analyst = handle;
  })();
</script>
</body>
</html>
