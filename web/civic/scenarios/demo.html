<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R07 — сценарии перекрытий (демо модуля)</title>
<link rel="stylesheet" href="/vendor/maplibre-gl.css">
<link rel="stylesheet" href="/civic/scenarios/scenarios.css">
<style>
  html, body { margin: 0; height: 100%; background: #f8f9fa; }
  #wrap { display: flex; height: 100%; }
  #map { flex: 1 1 auto; min-width: 0; }
  #side { flex: 0 0 420px; overflow: auto; border-left: 1px solid #dee2e6; background: #fff; }
  #basemap { position: absolute; left: 8px; bottom: 8px; z-index: 2; background: #fff; font: 12px system-ui; padding: 4px 8px; border-radius: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  @media (max-width: 760px) { #wrap { flex-direction: column; } #map { flex: 0 0 45vh; } #side { flex: 1 1 auto; border-left: 0; border-top: 1px solid #dee2e6; } }
</style>
</head>
<body>
<div id="wrap"><div id="map"></div><aside id="side"></aside></div>
<div id="basemap">Подложка: загрузка…</div>
<script src="/vendor/maplibre-gl.js"></script>
<script src="/civic/scenarios/scenarios.js"></script>
<script>
  // Демо модуля R07 вне основного приложения. В продукте mount вызывает R01 со своей картой и api.
  const api = { request(method, path, body) {
    return fetch(path, { method, headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined, credentials: "same-origin" })
      .then((r) => r.json()).then((j) => { if (!j.ok) { const e = new Error(j.error.message); e.code = j.error.code; e.fields = j.error.fields; throw e; } return j.data; });
  } };
  const BLANK = { version: 8, sources: {}, layers: [{ id: "bg", type: "background", paint: { "background-color": "#f1f3f5" } }] };
  const want = new URLSearchParams(location.search).get("basemap");
  const info = document.getElementById("basemap");
  const map = new maplibregl.Map({ container: "map", style: want === "none" ? BLANK : "https://tiles.openfreemap.org/styles/positron", center: [71.43, 51.17], zoom: 14, attributionControl: true });
  window.__map = map;  // только для браузерной проверки демо
  let mounted = false;
  function start(label) {
    if (mounted) return; mounted = true; info.textContent = label;
    window.R07 = CivicScenarios.mount({ root: document.getElementById("side"), map, api });
  }
  map.on("load", () => start(want === "none" ? "Подложка: отключена (?basemap=none)" : "Подложка: OpenFreeMap positron © OpenStreetMap"));
  map.on("error", (e) => { if (!mounted) { map.setStyle(BLANK); info.textContent = "Подложка недоступна — показан только граф"; map.once("styledata", () => start(info.textContent)); } });
</script>
</body>
</html>
